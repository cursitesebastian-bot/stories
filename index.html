<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app">
    <h1 class="app-title">Stories</h1>
 
    <div class="app">
    <h1 class="app-title">Stories</h1>
 
    <!-- Story bar -->
    <div class="story-bar" id="storyBar">
      <button class="story-item add-btn" id="addBtn" aria-label="Add a story">
        <span class="story-avatar">
          <span class="plus-icon">+</span>
        </span>
        <span class="story-name">Add</span>
      </button>
      <!-- story avatars get inserted here by JS -->
    </div>
 
    <input type="file" id="fileInput" accept="image/*" hidden>
 
    <p class="hint" id="hint">Add a story — it disappears after 24 hours.</p>
  </div>
 
  <!-- Fullscreen story viewer -->
  <div class="viewer" id="viewer" hidden>
    <div class="progress-row" id="progressRow"></div>
 
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
 
    <div class="viewer-media-wrap" id="viewerMediaWrap">
      <img id="viewerImage" class="viewer-image" alt="Story">
      <div class="tap-zone tap-left" id="tapLeft"></div>
      <div class="tap-zone tap-right" id="tapRight"></div>
    </div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  
    <div id="root"></div>
    <div id="branch"></div>
    <script type="module" src="/src/main.jsx"></script>

    
  </body>
</html>
